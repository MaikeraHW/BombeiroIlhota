<!DOCTYPE html>

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="transparenciaBody">
    <header class="header">
        <div class="topBarContainer">
            <div class="topBar">
                    <div class="logo">

                        </a>
                    </div>
                    <div class="topBarContent">
                        <div class="topBarText">

                        <div class="topBarButton">

        </div>
        <nav class="headerNav">

            </div>
            <div id="pdf1" class="hidden">
                <div class="showing">
                <img class="imgHidden" src="../src/26marco02.jpg" />
                </div>
            </div>
        </div>

        <div class="pdf-container">
            <div class="pdfContainerHead">
            <h3>Comunicado - 30/04/2026</h3>
            <button class="toggleButton" onclick="togglePDF('pdf2')">Exibir</button>
            </div>
            <div id="pdf2" class="hidden">
                <div class="showing">
                <img class="imgHidden" src="../src/26abril30.jpg" />
                </div>
            </div>

</div>
